# ==============================================================================
# PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Samahat Taibah Educational Management System (EMS)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ems-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-ems_database}
    volumes:
      - ems_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems_user} -d ${POSTGRES_DB:-ems_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-backend-net

  # ----------------------------------------------------------------------------
  # 2. Redis - Cache, Socket.IO cluster adapter, and BullMQ queues
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ems-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ems_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-backend-net

  # ----------------------------------------------------------------------------
  # 3. NestJS Backend API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ems-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-ems_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ems_database}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      ENABLE_DEV_AUTH_TOKENS: ${ENABLE_DEV_AUTH_TOKENS:-false}
      EMAIL_SERVICE_ENABLED: ${EMAIL_SERVICE_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ems.yourdomain.com}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ems_uploads:/app/apps/api/uploads
    networks:
      - ems-backend-net
      - ems-frontend-net

  # ----------------------------------------------------------------------------
  # 4. FastAPI AI Microservice (Gemini & Copilot agents)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: ems-prod-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_ENV: production
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      MAIN_API_INTERNAL_URL: http://api:4000/api/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_REQUEST_TIMEOUT: 30
      GEMINI_MAX_RETRIES: 3
      AI_MOCK_FALLBACK: ${AI_MOCK_FALLBACK:-false}
    networks:
      - ems-backend-net
      - ems-frontend-net

  # ----------------------------------------------------------------------------
  # 5. Next.js Frontend Web Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-"Samahat Taibah Educational Management System"}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_AI_SERVICE_URL: ${NEXT_PUBLIC_AI_SERVICE_URL:-/ai}
    container_name: ems-prod-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: "Samahat Taibah Educational Management System"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_AI_SERVICE_URL: ${NEXT_PUBLIC_AI_SERVICE_URL:-/ai}
    networks:
      - ems-frontend-net

  # ----------------------------------------------------------------------------
  # 6. Nginx Reverse Proxy (SSL Termination, WebSockets & Security Headers)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ems-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ems_ssl_certs:/etc/nginx/ssl:ro
      - ems_certbot_www:/var/www/certbot:ro
    networks:
      - ems-frontend-net

  # ----------------------------------------------------------------------------
  # 7. Certbot (Automated Let's Encrypt TLS Certificate Issuance & Renewal)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: ems-prod-certbot
    volumes:
      - ems_ssl_certs:/etc/nginx/ssl
      - ems_certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

# ------------------------------------------------------------------------------
# NETWORKS & VOLUMES (Data Isolation & Zero-Downtime Persistence)
# ------------------------------------------------------------------------------
networks:
  ems-backend-net:
    driver: bridge
    internal: true
  ems-frontend-net:
    driver: bridge

volumes:
  ems_postgres_data:
    name: ems_prod_postgres_data
  ems_redis_data:
    name: ems_prod_redis_data
  ems_uploads:
    name: ems_prod_uploads_data
  ems_ssl_certs:
    name: ems_prod_ssl_certs
  ems_certbot_www:
    name: ems_prod_certbot_www
